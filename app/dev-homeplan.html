<!DOCTYPE html>
<!-- DEVELOPMENT PAGE, not linked from the app. It mounts the Home plan view
     (js/app/views/homeplan.js) outside the shell, inside the same markup the shell uses,
     with a fake ctx: a case from js/cases.js (Alex by default), the state from
     js/app/store.js getState() and the engine options from engineOpts().
     Open it through the local server: python serve.py, then /dev-homeplan.html.
     ?case=<id> opens another case, for example ?case=demo-carpal or a user case id. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home plan (development page) · Red-Flag Navigator</title>
  <!-- The same fonts as index.html, so the page looks as it will in the app. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app" class="app">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark" aria-hidden="true">RF</div><div><div class="brand-name">Red-Flag Navigator</div><div class="brand-sub">Development page: Home plan only</div></div></div>
      <nav aria-label="Main"><div class="nav-group"><div class="micro">Development</div><a class="nav-item active" href="dev-homeplan.html" aria-current="page"><span class="dot"></span>Home plan</a><a class="nav-item" href="index.html#plan"><span class="dot"></span>Open in the app</a></div></nav>
      <div class="sidebar-foot">Not linked from the app. It never diagnoses.</div>
    </aside>
    <div class="main">
      <header class="topbar">
        <div class="crumbs"><span>Development</span><span class="sep">/</span><span id="dev-name"></span><span class="sep">/</span><b>Home plan and device data</b></div>
        <div class="topbar-controls">
          <label class="ctrl"><span class="micro">Case</span><select class="select" id="dev-case" aria-label="Patient case"></select></label>
          <label class="ctrl"><span class="micro">Visit</span><select class="select" id="dev-visit" aria-label="Visit to look at"></select></label>
          <label class="switch"><input type="checkbox" id="dev-home"><span class="track"></span>Home data</label>
        </div>
      </header>
      <main class="view" id="view" tabindex="-1"><div class="loading">Loading…</div></main>
    </div>
  </div>
  <script type="module">
    import { getState, setState, engineOpts } from './js/app/store.js';
    import { listCases, getCase, defaultVisit } from './js/cases.js';
    import { esc, fmtDate } from './js/app/ui.js';
    import { mount } from './js/app/views/homeplan.js';

    const params = new URLSearchParams(location.search);
    const entry = getCase(params.get('case') || 'alex');
    const view = document.getElementById('view');
    const visits = (entry.caseFile.encounters || []).map((e) => e.date);
    // The shell opens Alex at 9 Dec 2024 and other cases at their latest visit.
    if (getState().caseId !== entry.id || (visits.length && !visits.includes(getState().asOf))) {
      setState({ caseId: entry.id, asOf: entry.id === 'alex' ? '2024-12-09' : (defaultVisit(entry.caseFile) || getState().asOf) });
    }
    const ctx = () => ({
      state: getState(), setState: (patch) => { setState(patch); sync(); handle.update && handle.update(ctx()); },
      opts: engineOpts(), caseEntry: entry, caseFile: entry.caseFile,
      navigate: (id) => { location.href = `index.html#${id}`; },
    });

    document.getElementById('dev-name').textContent = entry.caseFile.patient.name;
    document.getElementById('dev-case').innerHTML = listCases().map((c) => `<option value="${esc(c.id)}"${c.id === entry.id ? ' selected' : ''}>${esc(c.name)}</option>`).join('');
    document.getElementById('dev-case').addEventListener('change', (e) => { location.search = `?case=${encodeURIComponent(e.target.value)}`; });
    const visitSel = document.getElementById('dev-visit');
    visitSel.innerHTML = visits.length ? (entry.caseFile.encounters || []).map((e) => `<option value="${esc(e.date)}">${fmtDate(e.date)} · ${esc(e.setting)}</option>`).join('') : '<option value="">No visits yet</option>';
    visitSel.disabled = !visits.length;
    const home = document.getElementById('dev-home');
    function sync() {
      const s = getState();
      if (s.asOf) visitSel.value = s.asOf;
      home.checked = s.includeHome;
    }
    visitSel.addEventListener('change', () => { setState({ asOf: visitSel.value }); handle.update && handle.update(ctx()); });
    home.addEventListener('change', () => { setState({ includeHome: home.checked }); handle.update && handle.update(ctx()); });
    // Internal links to app routes go to the app itself.
    document.addEventListener('click', (e) => {
      const a = e.target instanceof Element ? e.target.closest('a[href^="#"]') : null;
      if (a && a.getAttribute('href').length > 1) { e.preventDefault(); location.href = `index.html${a.getAttribute('href')}`; }
    });
    sync();
    view.innerHTML = '';
    let handle = {};
    try {
      handle = mount(view, ctx()) || {};
    } catch (err) {
      console.error(err);
      view.innerHTML = `<div class="error-card"><b>The view did not load.</b> ${esc(err.message || err)}</div>`;
    }
    window.__homeplan = { get handle() { return handle; }, ctx };
    addEventListener('pagehide', () => { if (handle.unmount) handle.unmount(); });
  </script>
</body>
</html>
